<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — Grocery Buddy</title>
    <script>
      // The app's saved Theme setting, applied before first paint. Same logic
      // as the script in index.html and applyTheme() in
      // src/settings/theme.ts — keep the three in step. This page has no
      // theme-color metas, so only data-theme/color-scheme apply; "Same as
      // device" also follows the device switching while the page is open.
      ;(function () {
        var theme = 'system'
        try {
          var saved = localStorage.getItem('grocery-buddy:theme')
          if (saved === 'light' || saved === 'dark' || saved === 'system') theme = saved
          else if (saved !== null) console.error('Grocery Buddy: unknown saved theme ' + JSON.stringify(saved) + ' — using the device theme')
        } catch (err) {
          console.error('Grocery Buddy: could not read the theme setting — using the device theme', err)
        }
        var darkQuery = matchMedia('(prefers-color-scheme: dark)')
        function apply() {
          var resolved = theme === 'system' ? (darkQuery.matches ? 'dark' : 'light') : theme
          document.documentElement.dataset.theme = resolved
          document.documentElement.style.colorScheme = resolved
        }
        apply()
        if (theme === 'system') darkQuery.addEventListener('change', apply)
      })()
    </script>
    <style>
      :root {
        /* Same grayscale palette as src/index.css, duplicated here since
           this page is a standalone static file (not part of the Vite
           build) and must be reachable before any app asset loads. */
        --text: #1a1a1a;
        --text-muted: rgba(26, 26, 26, 0.62);
        --bg: #ffffff;
        --surface: #f5f5f6;
        --surface-hover: #ebebec;
        --border: #e0e0e0;
        --border-strong: #b7b7bc;
        --accent: #3f3f46;
        --accent-hover: #27272a;
        --accent-contrast: #ffffff;
        --danger: #c62828;
        --radius: 10px;
        --radius-sm: 6px;

        color-scheme: light;
        font: 16px/1.45 system-ui, 'Segoe UI', Roboto, sans-serif;
      }

      /* Keyed on data-theme like src/index.css, set by the script below. */
      :root[data-theme='dark'] {
        --text: #f3f4f6;
        --text-muted: rgba(243, 244, 246, 0.6);
        --bg: #16171d;
        --surface: #1e1f27;
        --surface-hover: #262733;
        --border: #2d2e38;
        --border-strong: #63646f;
        --accent: #a1a1aa;
        --accent-hover: #c3c3ca;
        --accent-contrast: #16171d;
        --danger: #f28b82;

        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: 100%;
        max-width: 320px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
        text-align: center;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }

      input[type='password'] {
        font: inherit;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0.6rem 0.7rem;
      }

      input[type='password']:focus-visible {
        outline: 2px solid var(--border-strong);
        outline-offset: 2px;
      }

      button {
        font: inherit;
        font-weight: 600;
        color: var(--accent-contrast);
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: var(--radius-sm);
        padding: 0.6rem 0.9rem;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      p[data-error] {
        margin: 0;
        color: var(--danger);
        font-size: 0.85rem;
        min-height: 1.2em;
      }

      .mascot {
        display: block;
        margin: 0 auto -0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Mascot above the title (negative bottom margin pulls the title up
           closer to it), same centered-mascot-above-title layout as
           HomePage/AboutPage — no Mascot.tsx here since this is a
           standalone static page, not a React route. -->
      <img class="mascot" src="/mascot/idle.png" alt="" width="120" height="120" data-testid="login-mascot" />
      <h1>Grocery Buddy</h1>
      <form id="login-form">
        <input
          type="password"
          name="password"
          data-testid="login-password"
          placeholder="Password"
          aria-label="Password"
          autocomplete="current-password"
          autofocus
          required
        />
        <button type="submit" data-testid="login-submit">Log in</button>
        <p data-error data-testid="login-error" role="alert"></p>
      </form>
    </main>

    <script>
      // Language: the app's own saved language setting, mapped to this
      // page's handful of strings —
      // this page is plain static HTML outside the React app, so it can't
      // import the app's dictionaries.
      const STRINGS = {
        en: {
          title: 'Log in — Grocery Buddy',
          password: 'Password',
          submit: 'Log in',
          incorrectPassword: 'Incorrect password',
          notConfigured: 'Login is not configured on this deployment.',
          failed: 'Login failed — try again.',
          connection: 'Connection issue — try again.',
        },
        ru: {
          title: 'Вход — Grocery Buddy',
          password: 'Пароль',
          submit: 'Войти',
          incorrectPassword: 'Неверный пароль',
          notConfigured: 'Вход не настроен на этом сервере.',
          failed: 'Не удалось войти — попробуйте ещё раз.',
          connection: 'Проблема со связью — попробуйте ещё раз.',
        },
      }
      // Same key as src/settings/settingsStore.ts. Falls back to the old
      // combined region key, in case this page loads before the app has
      // migrated it.
      let language = 'en'
      try {
        const saved = localStorage.getItem('grocery-buddy:language')
        if (saved === 'ru' || (saved === null && localStorage.getItem('grocery-buddy:region') === 'ru-BYN')) language = 'ru'
      } catch (err) {
        console.error('Grocery Buddy: could not read the language setting — using English', err)
      }
      const text = STRINGS[language]
      document.documentElement.lang = language
      document.title = text.title

      const form = document.getElementById('login-form')
      const errorEl = form.querySelector('[data-error]')
      const submitButton = form.querySelector('button')
      const passwordInput = form.querySelector('input[name="password"]')
      passwordInput.placeholder = text.password
      passwordInput.setAttribute('aria-label', text.password)
      submitButton.textContent = text.submit

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        errorEl.textContent = ''
        submitButton.disabled = true

        const password = new FormData(form).get('password')
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ password }),
          })
          if (res.ok) {
            const params = new URLSearchParams(window.location.search)
            const next = params.get('next')
            // Only ever redirect to a same-site path — a leading "//" would
            // be a protocol-relative URL (e.g. "//evil.com"), so it's
            // explicitly excluded alongside anything not starting with "/".
            const isSafeNext = next && next.startsWith('/') && !next.startsWith('//')
            window.location.href = isSafeNext ? next : '/'
            return
          }
          // The server's own error text is English; the known cases are
          // mapped by status so they're shown in the page's language, and
          // anything else keeps the server's detail after a generic message.
          const data = await res.json().catch((err) => {
            console.error('Grocery Buddy: login error response was not JSON', err)
            return null
          })
          if (res.status === 401) errorEl.textContent = text.incorrectPassword
          else if (res.status === 503) errorEl.textContent = text.notConfigured
          else errorEl.textContent = data?.error ? `${text.failed} (${data.error})` : text.failed
        } catch (err) {
          console.error('Grocery Buddy: login request failed', err)
          errorEl.textContent = text.connection
        } finally {
          submitButton.disabled = false
        }
      })
    </script>
  </body>
</html>
